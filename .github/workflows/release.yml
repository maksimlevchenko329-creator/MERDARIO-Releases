name: Publish MERDARIO release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Human-readable version, e.g. 1.0.0"
        required: true
        type: string
      version_code:
        description: "Increasing Android versionCode"
        required: true
        type: string
      mandatory:
        description: "Force users to update"
        required: true
        type: choice
        options: ["false", "true"]
      changelog:
        description: "Release notes"
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/merdario-release.jks"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/merdario-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          gradle --no-daemon --stacktrace assembleRelease \
            -PappVersionCode=${{ inputs.version_code }} \
            -PappVersionName="${{ inputs.version_name }}"
      - name: Prepare release metadata
        id: meta
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/MERDARIO.apk
          SHA=$(sha256sum release/MERDARIO.apk | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Publish APK and latest.json
        env:
          RELEASES_TOKEN: ${{ secrets.MERDARIO_RELEASES_TOKEN }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          MANDATORY: ${{ inputs.mandatory }}
          CHANGELOG: ${{ inputs.changelog }}
          SHA256: ${{ steps.meta.outputs.sha }}
        run: |
          test -n "$RELEASES_TOKEN" || (echo "Missing MERDARIO_RELEASES_TOKEN" && exit 1)
          git clone "https://x-access-token:${RELEASES_TOKEN}@github.com/maksimlevchenko329-creator/MERDARIO-Releases.git" releases-repo
          mkdir -p "releases-repo/releases/$VERSION_NAME" releases-repo/changelogs
          cp release/MERDARIO.apk "releases-repo/releases/$VERSION_NAME/MERDARIO.apk"
          printf '%s\n' "$CHANGELOG" > "releases-repo/changelogs/$VERSION_NAME.md"
          APK_URL="https://raw.githubusercontent.com/maksimlevchenko329-creator/MERDARIO-Releases/main/releases/$VERSION_NAME/MERDARIO.apk"
          export APK_URL
          python3 - <<'PY'
          import json, os
          data = {
            "appId": "com.levmak.merdario",
            "versionCode": int(os.environ["VERSION_CODE"]),
            "versionName": os.environ["VERSION_NAME"],
            "mandatory": os.environ["MANDATORY"] == "true",
            "apkUrl": os.environ["APK_URL"],
            "sha256": os.environ["SHA256"],
            "changelog": os.environ["CHANGELOG"]
          }
          with open("releases-repo/latest.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
            f.write("\\n")
          catalog_path = "releases-repo/apps.json"
          try:
            with open(catalog_path, encoding="utf-8") as f:
              catalog = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
            catalog = {"schemaVersion": 1, "apps": []}
          apps = catalog.setdefault("apps", [])
          entry = {
            **data,
            "name": "MERDARIO",
            "changelog": [line.strip("- •") for line in os.environ["CHANGELOG"].splitlines() if line.strip()],
            "logoUrl": "https://raw.githubusercontent.com/maksimlevchenko329-creator/MERDARIO-Releases/main/assets/merdario.png"
          }
          apps[:] = [app for app in apps if app.get("appId") != data["appId"]]
          apps.insert(0, entry)
          catalog["schemaVersion"] = 1
          with open(catalog_path, "w", encoding="utf-8") as f:
            json.dump(catalog, f, ensure_ascii=False, indent=2)
            f.write("\\n")
          PY
          cd releases-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release MERDARIO $VERSION_NAME"
          git push
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/merdario-release.jks"
